{% extends "store/base.html" %}

{% block content %}

<style>
    .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
    }

    .card {
        background: white;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-align: center;
    }

    .card img {
        width: 100%;
        height: 180px;
        object-fit: contain;
    }

    .price {
        color: green;
        font-weight: bold;
        margin: 8px 0;
    }

    .actions a {
        display: inline-block;
        margin: 5px;
        padding: 6px 10px;
        background: #2874f0;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
    }

    .actions a.group {
        background: #ff9800;
    }

    .actions a:hover {
        opacity: 0.9;
    }
</style>

<h2>Products</h2>

<form method="get" class="search-box">
    <input
        id="searchInput"
        name="q"
        placeholder="Search products"
        value="{{ request.GET.q }}"
        style="flex:1; padding:8px;"
    >

    <button type="submit">Search</button>

    <button type="button" onclick="startVoice()">🎤</button>
</form>

<div class="products">
    {% for p in products %}
        <div class="card">

            {% if p.image %}
                <img src="{{ p.image.url }}">
            {% else %}
                <img src="https://via.placeholder.com/200x150?text=No+Image">
            {% endif %}

            <h4>{{ p.name }}</h4>

            <div class="price">₹{{ p.price }}</div>

            <div class="actions">
                <a href="{% url 'add_to_cart' p.id %}">Add to Cart</a>
                <a href="{% url 'join_group' p.id %}" class="group">Join Group</a>
            </div>

        </div>
    {% empty %}
        <p>No products found.</p>
    {% endfor %}
</div>

<script>
function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Voice search not supported in this browser");
        return;
    }

    const recognition = new webkitSpeechRecognition();
    recognition.lang = 'en-IN';   // You can change to hi-IN / te-IN
    recognition.start();

    recognition.onresult = function(event) {
        document.getElementById('searchInput').value =
            event.results[0][0].transcript;
        document.querySelector('form').submit();
    };
}
</script>

{% endblock %}
