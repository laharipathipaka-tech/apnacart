<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
</head>
<body>

<h2>Checkout</h2>

{% if messages %}
    {% for message in messages %}
        <p style="color:red; font-weight:bold;">
            {{ message }}
        </p>
    {% endfor %}
{% endif %}

<p><strong>Total Amount:</strong> ₹{{ total }}</p>
<p><strong>Your Monthly Budget:</strong> ₹{{ limit }}</p>

{% if total <= limit %}
    <button>Place Order</button>
{% else %}
    <p style="color:red;">
        You are exceeding your budget. You can still continue if allowed.
    </p>
    <button>Continue Anyway</button>
{% endif %}

<br><br>
<a href="{% url 'cart' %}">⬅ Back to Cart</a>

</body>
</html>
