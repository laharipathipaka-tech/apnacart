<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ApnaCart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            margin: 0;
        }
        .navbar {
            background: #2874f0;
            padding: 12px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
        }
        .badge {
            background: red;
            padding: 2px 6px;
            border-radius: 50%;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'cart' %}">
            🛒 Cart <span class="badge">{{ cart_count }}</span>
        </a>
        <a href="{% url 'checkout' %}">
            💰 Budget ₹{{ budget_left }}
        </a>
    </div>

    <div>
        {% if user.is_authenticated %}
            <span>Hello, {{ user.username }}</span>
            |
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            |
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
